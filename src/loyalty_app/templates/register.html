<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kassza - Husegpont</title>
  <link rel="stylesheet" href="/static/styles.css?v=2" />
</head>
<body data-role="{{ role }}"{% if initial_qr_payload %} data-initial-qr-payload="{{ initial_qr_payload }}"{% endif %}>
  <header class="topbar">
    <div><strong>Husegpont kassza</strong> <span id="offline-indicator" class="offline-badge" hidden>UNAS kapcsolat nem elerheto</span></div>
    <div>
      {{ username }} ({{ role }})
      <form method="post" action="/logout" style="display:inline">
        <button type="submit" class="link-button">Kijelentkezes</button>
      </form>
    </div>
  </header>

  <main class="layout">
    <section class="scan-panel">
      <h2>QR beolvasas</h2>
      <input id="scan-input" type="text" placeholder="Olvasd be a vasarlo QR-kodjat..." autocomplete="off" autofocus />
      <div id="scan-status" class="status-banner" hidden></div>

      <div id="customer-panel" class="customer-panel" hidden>
        <h3 id="customer-name">-</h3>
        <p>Kartya: <span id="customer-card">-</span></p>
        <p>Egyenleg: <strong id="customer-balance">-</strong> pont</p>

        <div class="op-grid">
          <div class="op-box earn-box">
            <label>Vasarlas osszege (Ft)
              <input id="earn-amount" type="number" min="0" step="1" />
            </label>
            <p class="preview" id="earn-preview"></p>
            <label>Nyugtaszam
              <input id="earn-receipt" type="text" />
            </label>
            <button id="earn-button" class="btn btn-earn">Pont jovairasa</button>
          </div>

          <div class="op-box redeem-box">
            <label>Bevaltando pont
              <input id="redeem-points" type="number" min="0" step="1" />
            </label>
            <p class="preview" id="redeem-preview"></p>
            <label>Nyugtaszam
              <input id="redeem-receipt" type="text" />
            </label>
            <button id="redeem-button" class="btn btn-redeem">Pont bevaltasa</button>
          </div>
        </div>

        <button id="reset-button" class="btn btn-secondary">Uj vasarlo beolvasasa</button>
      </div>
    </section>

    <section class="history-panel">
      <h2>Legutobbi tranzakciok</h2>
      <button id="refresh-history" class="btn btn-secondary">Frissites</button>
      <ul id="history-list"></ul>
    </section>
  </main>

  <div id="confirm-modal" class="modal" hidden>
    <div class="modal-box">
      <h3 id="confirm-title">Megerosites</h3>
      <p id="confirm-body"></p>
      <div class="modal-actions">
        <button id="confirm-cancel" class="btn btn-secondary">Megse</button>
        <button id="confirm-ok" class="btn btn-primary">Megerosites</button>
      </div>
    </div>
  </div>

  <script src="/static/register.js?v=3"></script>
</body>
</html>
