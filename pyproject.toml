[project]
name = "loyalty-app"
version = "0.1.0"
description = "UNAS QR-alapu bolti husegpont middleware"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "defusedxml>=0.7.1",
    "tenacity>=8.5",
    "bcrypt>=4.0,<5.0",
    "itsdangerous>=2.2",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
